name: Feature request
description: Suggest something new — a format, a provider, a workflow.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the task in your practice that this would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
