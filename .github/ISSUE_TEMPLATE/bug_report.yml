name: Bug report
description: Something in Advocate Draft does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not include client names, facts, documents, drafts or API keys** — use made-up details.
        Security problems go through the Security tab, not here (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose a format…
        2. Add a scanned PDF…
        3. Click Generate…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: From the installer name or Add or remove programs (e.g. 0.2.0), or the commit if running from source.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: AI provider
      options:
        - Not relevant
        - Claude (Anthropic)
        - Gemini (Google)
        - OpenRouter
        - ChatGPT (sign in)
        - Ollama (on this computer)
  - type: input
    id: model
    attributes:
      label: Model (if relevant)
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 23H2
  - type: textarea
    id: extra
    attributes:
      label: Error messages or screenshots
      description: Paste any error text shown in the app. Check screenshots contain no client information.
